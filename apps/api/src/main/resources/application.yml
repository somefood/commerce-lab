# ============================================================
# 로컬 개발 설정. (배포 환경 설정은 Phase 7에서 프로파일로 분리한다)
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      # create-drop: 앱 시작 시 엔티티 기준으로 테이블 생성, 종료 시 삭제.
      # ⚠️ 실무 운영 환경에서는 절대 금지 (validate + 마이그레이션 도구 사용).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true # 학습용: JPA가 실제로 날리는 SQL을 눈으로 확인한다

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 기동 시 시드되는 ADMIN 계정 (AdminAccountSeeder).
# ⚠️ 학습용 기본값. 배포 시 환경변수 APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD로 덮는다.
app:
  admin:
    email: admin@commercelab.dev
    password: admin1234!

