name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers는 러너의 Docker 데몬을 그대로 쓴다. 별도 services 블록이 필요 없다.
      - name: 아키텍처 규칙 검사
        working-directory: backend
        run: ./gradlew :bootstrap:archTest

      - name: 전체 테스트
        working-directory: backend
        run: ./gradlew build

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/build/reports/tests/

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # Next의 라우트 타입(LayoutProps 등)은 .next/types에 생성된다.
      # 이게 없으면 tsc가 "Cannot find name 'LayoutProps'"로 실패한다.
      - name: 라우트 타입 생성
        working-directory: frontend
        run: npx next typegen

      # 백엔드 OpenAPI에서 생성한 타입(src/types/api.d.ts)은 커밋돼 있으므로
      # 백엔드를 띄우지 않고도 계약 위반을 여기서 잡는다.
      - name: 타입 검사
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 빌드
        working-directory: frontend
        run: npm run build
