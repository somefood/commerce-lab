spring:
  application:
    name: commerce-lab
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: commerce
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    # 이력 테이블(flyway_schema_history)은 기본 스키마(public)에 둔다.
    # 마이그레이션 SQL은 "order"/ payment 스키마를 항상 명시적으로 적는다.
    # 스키마 생성 자체는 인프라의 몫이다 (infra/postgres/init/01-schemas.sql).
    locations: classpath:db/migration
    # 운영에서 스키마가 손상됐을 때 자동으로 고치지 않는다. 사람이 본다.
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: commerce-lab
    distribution:
      # 히스토그램 버킷이 있어야 Prometheus에서 p95/p99를 계산할 수 있다.
      # 기본값은 꺼져 있어서 histogram_quantile()이 빈 결과를 준다.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.commercelab: DEBUG
